<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏活动日历 · 原神 / 星铁 / 绝区零 / 终末地 / 明日方舟 / 鸣潮</title>
<style>
  :root{
    --bg:#070a11;
    --panel:rgba(17,22,34,.78);
    --panel-solid:#0f1420;
    --line:rgba(255,255,255,.075);
    --line-strong:rgba(255,255,255,.14);
    --text:#e9edf7;
    --muted:#8b95ad;
    --dim:#5f6980;
    --accent:#8aa7ff;
    --mt:#8aa7ff;
    --mt-soft:rgba(138,167,255,.16);
    --mt-faint:rgba(138,167,255,.05);
    --radius:16px;
    --font:"Inter","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    min-height:100vh;
    color:var(--text);
    font-family:var(--font);
    font-size:14px;
    line-height:1.6;
    background:
      radial-gradient(1100px 620px at 8% -12%, rgba(122,162,255,.20), transparent 62%),
      radial-gradient(900px 560px at 96% -6%, rgba(185,140,255,.16), transparent 58%),
      radial-gradient(800px 520px at 50% 108%, rgba(78,201,255,.08), transparent 60%),
      var(--bg);
    background-attachment:fixed;
  }
  button{font-family:inherit}
  ::selection{background:rgba(122,162,255,.35)}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
  ::-webkit-scrollbar-track{background:transparent}

  .app{max-width:1560px;margin:0 auto;padding:30px 28px 64px}

  /* ---------- header ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:22px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:46px;height:46px;border-radius:14px;flex:none;
    background:linear-gradient(145deg,#7aa2ff,#b98cff 52%,#4ec9ff);
    display:grid;place-items:center;
    box-shadow:0 10px 34px rgba(122,162,255,.34), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .logo svg{width:24px;height:24px;display:block}
  h1{font-size:21px;margin:0;font-weight:700;letter-spacing:.6px;line-height:1.25}
  h1 span{
    background:linear-gradient(90deg,#fff,#b9c8ff 55%,#9ee6ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand-sub{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:.4px}
  .top-meta{font-size:11.5px;color:var(--dim);text-align:right;line-height:1.9}
  .top-meta b{color:var(--muted);font-weight:600}
  .top-meta b.stale{color:#ffb27a}
  .top-meta .live{display:inline-flex;align-items:center;gap:6px;color:#7fe3b4}
  .pulse{width:6px;height:6px;border-radius:50%;background:#4fd9a8;box-shadow:0 0 0 0 rgba(79,217,168,.7);animation:pulse 2s infinite}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(79,217,168,.55)}
    70%{box-shadow:0 0 0 7px rgba(79,217,168,0)}
    100%{box-shadow:0 0 0 0 rgba(79,217,168,0)}
  }

  /* ---------- toolbar ---------- */
  .toolbar{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:18px;
    display:flex;align-items:center;gap:16px 22px;flex-wrap:wrap;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  }
  .month-nav{display:flex;align-items:center;gap:8px}
  .nav-btn{
    width:32px;height:32px;border-radius:9px;border:1px solid var(--line);
    background:rgba(255,255,255,.03);color:var(--text);font-size:16px;line-height:1;
    cursor:pointer;display:grid;place-items:center;transition:.18s;
  }
  .nav-btn:hover{background:rgba(255,255,255,.08);border-color:var(--line-strong)}
  .month-label{min-width:126px;text-align:center;line-height:1.2}
  .month-label strong{display:block;font-size:16.5px;letter-spacing:.4px}
  .month-label span{font-size:9px;letter-spacing:2.4px;color:var(--mt);opacity:.85}
  .btn-ghost{
    height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--line);
    background:rgba(255,255,255,.03);color:var(--muted);font-size:12px;cursor:pointer;transition:.18s;
  }
  .btn-ghost:hover{color:var(--text);border-color:var(--line-strong)}

  .filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;min-width:300px}
  .filter-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .filter-sep{width:1px;height:20px;background:var(--line);margin:0 4px}
  .group-label{font-size:9px;letter-spacing:1.6px;color:var(--dim);padding:0 2px}
  .chip-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 11px;border-radius:999px;border:1px solid var(--line);
    background:rgba(255,255,255,.025);color:var(--muted);
    font-size:12px;line-height:1;cursor:pointer;transition:.18s;white-space:nowrap;
  }
  .chip-btn:hover{color:var(--text);border-color:var(--line-strong);background:rgba(255,255,255,.05)}
  .chip-btn.on{color:#0a0d14;background:var(--c,#dfe6ff);border-color:transparent;font-weight:600}
  .chip-btn.on .gdot{background:#0a0d14;opacity:.55}
  .gdot{width:6px;height:6px;border-radius:50%;background:var(--c,#8aa7ff);flex:none}
  .chip-btn.plain.on{background:#e9edf7;color:#0a0d14}
  .chip-btn .ticon{font-size:11px;opacity:.9}

  .seg{display:flex;padding:3px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.22)}
  .seg button{
    border:0;background:transparent;color:var(--muted);font-size:12px;
    padding:6px 12px;border-radius:7px;cursor:pointer;transition:.18s;white-space:nowrap;
  }
  .seg button:hover{color:var(--text)}
  .seg button.on{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
  .toolbar-right{display:flex;align-items:center;gap:10px;margin-left:auto}
  .local-dot{width:6px;height:6px;border-radius:50%;background:#ffb27a;margin-left:6px;display:inline-block;box-shadow:0 0 0 2px rgba(255,178,122,.16)}

  /* ---------- layout ---------- */
  main{display:grid;grid-template-columns:minmax(0,1fr) 338px;gap:18px;align-items:start}
  .board{
    background:
      radial-gradient(900px 340px at 50% -18%, var(--mt-soft), transparent 72%),
      var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  }
  .month-strip{
    display:flex;align-items:center;gap:6px;padding:9px 12px;
    border-bottom:1px solid var(--line);background:rgba(0,0,0,.12);
    overflow-x:auto;
  }
  .mstrip-btn{
    display:inline-flex;align-items:center;gap:5px;flex:none;
    padding:5px 11px;border-radius:999px;border:1px solid var(--line);
    background:rgba(255,255,255,.025);color:var(--muted);
    font-size:11px;line-height:1;cursor:pointer;transition:.18s;white-space:nowrap;
  }
  .mstrip-btn:hover{color:var(--text);border-color:var(--line-strong);background:rgba(255,255,255,.06)}
  .mstrip-btn.on{background:var(--mc);border-color:transparent;color:#0a0d14;font-weight:600}
  .mstrip-dot{width:4px;height:4px;border-radius:50%;background:var(--mc);flex:none;opacity:.75}
  .mstrip-btn.on .mstrip-dot{background:#0a0d14;opacity:.55}
  .mstrip-hint{margin-left:auto;padding:0 2px;font-size:9px;color:var(--dim);white-space:nowrap;flex:none;letter-spacing:.3px}
  @keyframes calInRight{from{opacity:.55;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}
  @keyframes calInLeft{from{opacity:.55;transform:translateX(-100%)}to{opacity:1;transform:translateX(0)}}
  .anim-right{animation:calInRight .32s cubic-bezier(.2,.8,.3,1)}
  .anim-left{animation:calInLeft .32s cubic-bezier(.2,.8,.3,1)}
  .view-stage{position:relative;overflow:hidden}
  .view-ghost{
    position:absolute;top:0;left:0;width:100%;pointer-events:none;z-index:3;
    background:#0f1420;will-change:transform,opacity;
    transition:transform .32s cubic-bezier(.2,.8,.3,1),opacity .32s ease;
  }
  @media (prefers-reduced-motion: reduce){.anim-right,.anim-left{animation:none}.view-ghost{display:none}}
  .board-hint{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 14px;border-bottom:1px solid var(--line);
    font-size:10.5px;color:var(--dim);letter-spacing:.3px;flex-wrap:wrap;
  }
  .board-hint b{color:var(--muted);font-weight:600}
  .board-hint .keys{display:flex;gap:12px;flex-wrap:wrap}
  .hint-key{display:inline-flex;align-items:center;gap:5px}
  .legend-ico{display:inline-flex;align-items:center;justify-content:center;width:12px;height:12px;color:var(--muted)}
  .legend-ico svg{width:11px;height:11px;display:block;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .ticon{display:inline-flex;align-items:center;justify-content:center;flex:none;font-style:normal}
  .ticon svg{width:1em;height:1em;display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- month view ---------- */
  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);background:var(--mt-faint)}
  .weekdays div{padding:10px 0;text-align:center;font-size:10.5px;letter-spacing:1.6px;color:var(--dim)}
  .weekdays div.we{color:#7c8aa8}
  .weeks{display:flex;flex-direction:column;background:linear-gradient(180deg,var(--mt-faint),transparent 160px)}
  .week{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
  .week:last-child{border-bottom:0}
  .day{
    min-height:116px;padding:7px 7px 6px;border-right:1px solid var(--line);
    display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:background .16s;
    position:relative;min-width:0;
  }
  .day:nth-child(7n){border-right:0}
  .day:hover{background:rgba(255,255,255,.028)}
  .day.out{background:rgba(0,0,0,.2)}
  .day.out .daynum b{color:var(--dim)}
  .day.today{background:linear-gradient(180deg,var(--mt-soft),var(--mt-faint))}
  .daynum{display:flex;align-items:center;justify-content:space-between;gap:4px;min-height:16px}
  .daynum b{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
  .day.today .daynum b{color:#fff}
  .today-tag{
    font-size:8.5px;font-style:normal;padding:1px 4px;border-radius:4px;
    background:rgba(122,162,255,.22);color:#b9c8ff;letter-spacing:.5px;
  }
  .day.out .today-tag{display:none}
  .mchip{
    display:flex;align-items:center;gap:4px;width:100%;min-width:0;
    padding:2px 5px;border-radius:5px;border:0;border-left:2px solid var(--c);
    background:var(--cbg);color:var(--text);
    font-size:10px;line-height:1.5;text-align:left;cursor:pointer;
    transition:filter .15s, transform .15s;
  }
  .mchip:hover{filter:brightness(1.3)}
  .mchip .ticon{font-size:9px;color:var(--c);opacity:.95}
  .mchip .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .mchip .edge{
    display:inline-flex;align-items:center;justify-content:center;flex:none;
    width:12px;height:12px;color:var(--c);opacity:.95;
  }
  .mchip .edge svg{width:9px;height:9px;display:block;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .more{font-size:9.5px;color:var(--dim);text-align:right;margin-top:auto;padding-right:2px}

  /* ---------- lane view（跨月连续时间轴） ---------- */
  .lane-topbar{display:flex;align-items:center;gap:10px;padding:9px 12px 9px 130px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.14)}
  .lane-topbar-label{font-size:9px;color:var(--dim);letter-spacing:.5px;white-space:nowrap}
  .lane-scrollbar{position:relative;flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.07);cursor:pointer;min-width:60px}
  .lane-scrollbar-thumb{position:absolute;top:0;height:8px;border-radius:4px;background:var(--mt);opacity:.7;cursor:grab;touch-action:none}
  .lane-scrollbar-thumb:hover{opacity:1}
  .lane-scrollbar-thumb.dragging{cursor:grabbing;opacity:1}
  .lane-scroll{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:none;-ms-overflow-style:none}
  .lane-scroll::-webkit-scrollbar{height:0;display:none}
  .lane-canvas{--label-w:118px;min-width:calc(var(--label-w) + var(--days) * 13px)}
  .lane-head,.lane-row{display:grid;grid-template-columns:var(--label-w) 1fr}
  .lane-head{border-bottom:1px solid var(--line);border-top:2px solid var(--mt);background:linear-gradient(180deg,var(--mt-soft),rgba(10,14,22,.55) 78%)}
  .lane-head-label{
    position:sticky;left:0;z-index:6;display:flex;flex-direction:column;justify-content:center;gap:1px;
    padding:0 12px;font-size:10px;letter-spacing:1.2px;color:var(--dim);
    border-right:1px solid var(--line);
    background:linear-gradient(90deg,var(--mt-soft),rgba(15,20,32,0) 80%),#0f1420;
  }
  .lane-head-label span{font-size:11px;color:var(--mt);font-weight:600;letter-spacing:.4px}
  .lane-head-label small{font-size:8.5px;color:var(--dim);letter-spacing:1.2px}
  .lane-head-main{min-width:0}
  .lane-months{display:grid;height:23px;border-bottom:1px solid var(--line)}
  .lane-month-seg{
    display:flex;align-items:center;padding:0 5px;overflow:hidden;white-space:nowrap;
    font-size:9px;color:var(--mc);border-left:2px solid var(--mc);letter-spacing:.4px;
  }
  .lane-month-seg:first-child{border-left:0}
  .lane-days{display:grid;height:23px}
  .lane-days div{
    display:flex;align-items:center;justify-content:center;
    border-left:1px solid rgba(255,255,255,.03);font-variant-numeric:tabular-nums;
    font-size:8px;color:var(--muted);
  }
  .lane-days div.we{background:rgba(255,255,255,.025)}
  .lane-days div.today{background:var(--mt-soft);color:#fff;font-weight:600}
  .lane-days div.month-first{border-left:1px solid rgba(255,255,255,.16)}
  .lane-row{border-bottom:1px solid var(--line)}
  .lane-row:last-child{border-bottom:0}
  .lane-label{
    position:sticky;left:0;z-index:5;display:flex;align-items:center;gap:7px;padding:0 12px;
    border-right:1px solid var(--line);min-height:44px;
    background:linear-gradient(90deg,var(--mt-soft),rgba(15,20,32,0) 80%),#0f1420;
  }
  .lane-label i{width:3px;height:18px;border-radius:3px;background:var(--c);flex:none}
  .lane-label span{font-size:11.5px;font-weight:600;color:var(--text);line-height:1.3}
  .lane-label small{display:block;font-size:9px;color:var(--dim);font-weight:400}
  .lane-track{
    position:relative;
    background-color:var(--mt-faint);
    background-image:var(--band),linear-gradient(to right,rgba(255,255,255,.04) 1px,transparent 1px);
    background-size:100% 100%,calc(100% / var(--n)) 100%;
    background-repeat:no-repeat,repeat;
    min-height:44px;
  }
  .lane-bar{
    position:absolute;height:21px;border-radius:5px;
    display:flex;align-items:center;gap:5px;padding:0 7px;overflow:hidden;
    font-size:10px;line-height:1;white-space:nowrap;cursor:pointer;
    border:1px solid var(--c);background:var(--cbg);color:var(--text);
    transition:filter .15s,box-shadow .15s;
  }
  .lane-bar:hover{filter:brightness(1.25);box-shadow:0 0 0 1px var(--c)}
  .lane-bar .txt{overflow:hidden;text-overflow:ellipsis}
  .lane-bar .ticon{font-size:10px;color:var(--c);opacity:.95}
  .lane-bar .arr{font-size:9px;color:var(--c);flex:none}
  .lane-bar.clip-l{border-top-left-radius:0;border-bottom-left-radius:0;border-left-style:dashed}
  .lane-bar.clip-r{border-top-right-radius:0;border-bottom-right-radius:0;border-right-style:dashed}
  .lane-today{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,140,140,.55);pointer-events:none;z-index:1}
  .lane-empty{padding:46px 20px;text-align:center;color:var(--dim);font-size:12px}
  .lane-empty-sm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--dim);pointer-events:none}

  /* ---------- sidebar ---------- */
  .side{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    display:flex;flex-direction:column;position:sticky;top:18px;
    max-height:calc(100vh - 40px);overflow:hidden;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  }
  .side-head{padding:14px 14px 0}
  .side-title{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);letter-spacing:.5px}
  .side-title b{color:var(--text);font-size:14px}
  .side-tabs{display:flex;gap:3px;margin-top:12px;border-bottom:1px solid var(--line)}
  .side-tab{
    flex:1;padding:8px 4px;border:0;background:none;color:var(--muted);font-size:11.5px;
    cursor:pointer;position:relative;border-radius:8px 8px 0 0;transition:.16s;white-space:nowrap;
  }
  .side-tab:hover{color:var(--text)}
  .side-tab.on{color:#fff;background:rgba(255,255,255,.055)}
  .side-tab.on::after{
    content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:2px;
    background:linear-gradient(90deg,#7aa2ff,#b98cff);border-radius:2px;
  }
  .side-tab em{font-style:normal;font-size:9.5px;color:var(--dim);margin-left:3px}
  .side-tab.on em{color:#b9c8ff}
  .side-body{padding:12px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:9px;min-height:120px}
  .side-empty{padding:34px 10px;text-align:center;color:var(--dim);font-size:11.5px;line-height:1.9}

  .ev-card{
    display:block;width:100%;text-align:left;cursor:pointer;
    padding:10px 11px;border-radius:11px;border:1px solid var(--line);
    background:rgba(255,255,255,.022);transition:.16s;color:var(--text);
  }
  .ev-card:hover{background:rgba(255,255,255,.055);border-color:var(--line-strong);transform:translateY(-1px)}
  .ev-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .ev-tags{display:flex;align-items:center;gap:4px}
  .img-chip{font-size:8.5px;color:var(--dim);border:1px solid var(--line);padding:2px 5px;border-radius:5px;white-space:nowrap}
  .gtag{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);letter-spacing:.2px}
  .gtag i{width:5px;height:5px;border-radius:50%;background:var(--c);flex:none}
  .tbadge{
    display:inline-flex;align-items:center;gap:3px;
    font-size:9px;padding:1px 5px;border-radius:4px;
    background:rgba(255,255,255,.07);color:var(--muted);flex:none;letter-spacing:.5px;
  }
  .tbadge .ticon{font-size:9px;opacity:.9}
  .ev-card h4{margin:6px 0 5px;font-size:12.5px;font-weight:600;line-height:1.45}
  .ev-card h4 small{display:block;font-size:10px;color:var(--dim);font-weight:400;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:9.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .ev-meta .left{color:var(--muted)}
  .ev-meta .rest{color:#ffb27a}
  .ev-meta .rest.live{color:#7fe3b4}
  .progress{height:3px;border-radius:3px;background:rgba(255,255,255,.07);margin-top:8px;overflow:hidden}
  .progress i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--c),rgba(255,255,255,.75))}
  .progress.open i{width:100%;background:repeating-linear-gradient(90deg,var(--c) 0 6px,transparent 6px 11px);opacity:.75}
  .up-next{font-size:9.5px;color:#9fd8ff;margin-top:7px;display:flex;align-items:center;gap:4px}

  .code-card{border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:rgba(255,255,255,.022)}
  .code-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:9.5px;color:var(--dim)}
  .status{font-size:9px;padding:1px 5px;border-radius:4px;letter-spacing:.3px}
  .status.ok{background:rgba(79,217,168,.14);color:#7fe3b4}
  .status.off{background:rgba(255,255,255,.055);color:var(--dim)}
  .status.warn{background:rgba(255,178,122,.14);color:#ffb27a}
  .code-val{
    display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0 4px;
    font-family:var(--mono);font-size:13px;color:#fff;letter-spacing:.4px;word-break:break-all;
  }
  .copy{
    flex:none;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);
    font-size:9.5px;padding:2px 7px;border-radius:5px;cursor:pointer;font-family:var(--font);
    transition:.16s;letter-spacing:.4px;
  }
  .copy:hover{color:#fff;border-color:var(--line-strong);background:rgba(255,255,255,.09)}
  .copy.done{color:#7fe3b4;border-color:rgba(79,217,168,.4)}
  .code-reward{font-size:9.5px;color:var(--dim);line-height:1.6}
  .code-from{display:block;margin-top:2px;opacity:.7}
  .code-group-title,.archive-title{
    display:flex;align-items:center;gap:6px;margin:1px 2px;
    font-size:9.5px;letter-spacing:1.2px;color:var(--dim);
  }
  .code-group-title span,.archive-title span{color:var(--muted);font-size:9px}
  .code-group-title::after,.archive-title::after{content:"";height:1px;flex:1;background:var(--line)}
  .archive-title{margin-top:12px;color:#a08a74}
  .code-hint{font-size:9px;color:var(--dim);line-height:1.7;padding:8px 2px 0;margin-top:2px;border-top:1px dashed rgba(255,255,255,.06)}
  .side-foot{padding:10px 14px 13px;border-top:1px solid var(--line);font-size:9.5px;color:var(--dim);line-height:1.75}

  /* ---------- modal ---------- */
  .modal{
    position:fixed;inset:0;z-index:80;display:none;place-items:center;padding:24px;
    background:rgba(3,6,12,.68);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  }
  .modal.open{display:grid;animation:fade .18s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal-card{
    width:min(580px,100%);max-height:84vh;overflow-y:auto;
    background:linear-gradient(180deg,#121826,#0d121c);
    border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:24px;
    box-shadow:0 30px 90px rgba(0,0,0,.65);animation:pop .22s cubic-bezier(.2,.8,.3,1);
    position:relative;
  }
  @keyframes pop{from{transform:translateY(12px) scale(.985);opacity:0}to{transform:none;opacity:1}}
  .modal-card.wide{width:min(780px,100%)}
  .modal-close{
    position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:8px;
    border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);
    font-size:16px;cursor:pointer;display:grid;place-items:center;line-height:1;transition:.16s;
  }
  .modal-close:hover{color:#fff;background:rgba(255,255,255,.09)}
  .d-eyebrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;padding-right:36px}
  .gpill{
    display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
    font-size:10.5px;color:var(--c);background:var(--cbg);border:1px solid var(--c);font-weight:600;
  }
  .gpill i{width:5px;height:5px;border-radius:50%;background:var(--c)}
  .d-title{font-size:21px;font-weight:700;line-height:1.35;margin:0 0 6px;letter-spacing:.3px}
  .d-sub{font-size:12.5px;color:var(--muted);line-height:1.6}
  .d-times{
    display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:18px 0 4px;
    background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  }
  .d-time{background:rgba(255,255,255,.028);padding:11px 13px}
  .d-time label{display:block;font-size:9px;letter-spacing:1.6px;color:var(--dim);margin-bottom:4px}
  .d-time div{font-size:12.5px;color:var(--text);font-variant-numeric:tabular-nums}
  .d-time div small{color:var(--muted);font-size:10px;margin-left:4px}
  .d-count{font-size:10px;color:var(--dim);margin-top:8px}
  .section-title{font-size:9.5px;letter-spacing:1.8px;color:var(--dim);margin:20px 0 9px;display:flex;align-items:center;gap:8px}
  .section-title::after{content:"";height:1px;flex:1;background:var(--line)}
  .banner-chips{display:flex;flex-wrap:wrap;gap:6px}
  .bchip{
    padding:5px 9px;border-radius:8px;background:rgba(255,255,255,.045);
    border:1px solid var(--line);font-size:11.5px;line-height:1.4;
  }
  .bchip small{color:var(--dim);margin-left:5px;font-size:9.5px}
  .d-note{font-size:12px;color:var(--muted);line-height:1.85;background:rgba(255,255,255,.022);border-left:2px solid rgba(255,255,255,.12);padding:9px 12px;border-radius:0 8px 8px 0}
  .d-bullets{margin:0;padding-left:16px;font-size:12px;color:var(--muted);line-height:1.9}
  .d-bullets li::marker{color:var(--dim)}
  .d-image{display:block;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#0a0e17;cursor:zoom-in}
  .d-image img{display:block;width:100%;height:auto;max-height:470px;object-fit:contain;background:#0a0e17}
  .d-image-cap{font-size:9.5px;color:var(--dim);margin-top:5px}
  .d-gallery{display:flex;gap:6px;margin-top:7px;overflow-x:auto;padding-bottom:2px}
  .d-gallery a{flex:none;width:76px;height:76px;border-radius:7px;overflow:hidden;border:1px solid var(--line);background:#0a0e17}
  .d-gallery img{width:100%;height:100%;object-fit:cover;display:block}
  .lightbox{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:24px;background:rgba(3,6,12,.94);backdrop-filter:blur(6px)}
  .lightbox.open{display:flex}
  .lightbox img{max-width:94vw;max-height:82vh;border-radius:10px;box-shadow:0 20px 80px rgba(0,0,0,.6);background:#0a0e17}
  .lb-close{position:fixed;top:16px;right:18px;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font-size:20px;line-height:1;cursor:pointer}
  .lb-open{font-size:11px;color:#9fb4e8;text-decoration:none;border-bottom:1px dashed rgba(159,180,232,.4)}
  body.lb-lock{overflow:hidden}
  .d-code-list{display:flex;flex-direction:column;gap:7px}
  .d-source{display:inline-flex;align-items:center;gap:5px;margin-top:18px;font-size:10.5px;color:#9fb4e8;text-decoration:none;border-bottom:1px dashed rgba(159,180,232,.4);padding-bottom:1px}
  .d-source:hover{color:#cfd9ff}

  .day-list{display:flex;flex-direction:column;gap:7px}
  .day-item{
    display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;
    border:1px solid var(--line);background:rgba(255,255,255,.022);cursor:pointer;transition:.15s;
  }
  .day-item:hover{background:rgba(255,255,255,.06);border-color:var(--line-strong)}
  .day-item i{width:3px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}
  .day-item .di-main{flex:1;min-width:0}
  .day-item .di-main b{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .day-item .di-main span{font-size:9.5px;color:var(--dim)}
  .day-item .di-type{display:inline-flex;align-items:center;gap:3px;font-size:9px;color:var(--muted);background:rgba(255,255,255,.06);padding:1px 5px;border-radius:4px;flex:none}
  .day-item .di-type .ticon{font-size:8px;opacity:.9}

  /* ---------- admin ---------- */
  .admin-stats{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:13px;font-size:10.5px;color:var(--dim)}
  .admin-stats span{position:relative;padding-left:9px}
  .admin-stats span::before{content:"";position:absolute;left:0;top:50%;width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.22);transform:translateY(-50%)}
  .admin-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
  .btn{
    height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:var(--muted);font-size:11.5px;cursor:pointer;
    display:inline-flex;align-items:center;gap:5px;transition:.16s;white-space:nowrap;
  }
  .btn:hover{color:#fff;border-color:var(--line-strong);background:rgba(255,255,255,.08)}
  .btn.primary{background:linear-gradient(135deg,#8aa7ff,#b98cff);border-color:transparent;color:#0a0d14;font-weight:600}
  .btn.primary:hover{filter:brightness(1.08);color:#0a0d14}
  .btn.danger{color:#ff9c9c}
  .btn.danger:hover{border-color:rgba(255,120,120,.35);background:rgba(255,90,90,.08)}
  .iconbtn{
    flex:none;height:24px;padding:0 8px;border-radius:6px;border:1px solid var(--line);
    background:rgba(255,255,255,.03);color:var(--muted);font-size:9.5px;cursor:pointer;transition:.15s;
  }
  .iconbtn:hover{color:#fff;background:rgba(255,255,255,.09);border-color:var(--line-strong)}
  .iconbtn.danger:hover{color:#ffb0b0;border-color:rgba(255,120,120,.3)}
  .adot{width:3px;align-self:stretch;min-height:28px;border-radius:3px;background:var(--c);flex:none}
  .admin-list{
    display:flex;flex-direction:column;gap:4px;max-height:40vh;overflow-y:auto;margin-top:8px;
    padding:6px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18);
  }
  .admin-item{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:7px;transition:.14s}
  .admin-item:hover{background:rgba(255,255,255,.04)}
  .ai-main{flex:1;min-width:0}
  .ai-main b{display:block;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ai-main span{display:block;font-size:9.5px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 12px}
  .field{display:flex;flex-direction:column;gap:5px;min-width:0}
  .field.full{grid-column:1/-1}
  .field label{font-size:9px;letter-spacing:1.2px;color:var(--dim)}
  .field input,.field select,.field textarea{
    width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:8px 10px;font-size:12px;font-family:inherit;outline:none;transition:.16s;
  }
  .field textarea{min-height:54px;resize:vertical;line-height:1.6}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(122,162,255,.6);box-shadow:0 0 0 2px rgba(122,162,255,.12)}
  .field input::placeholder,.field textarea::placeholder{color:#4d566b}
  .form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

  .hidden{display:none!important}

  @media (max-width:1180px){
    main{grid-template-columns:minmax(0,1fr)}
    .side{position:static;max-height:none}
    .side-body{max-height:420px}
  }
  @media (max-width:820px){
    .app{padding:20px 14px 48px}
    h1{font-size:18px}
    .top-meta{display:none}
    .toolbar{padding:12px;gap:12px}
    .month-nav{width:100%;justify-content:space-between}
    .month-label{min-width:0}
    .filters{min-width:0;width:100%}
    .filter-sep{display:none}
    .toolbar-right{margin-left:0;width:100%;justify-content:space-between}
    .form-grid{grid-template-columns:1fr}
    .day{min-height:92px;padding:5px 4px}
    .mchip{font-size:9px;padding:2px 4px}
    .weekdays div{font-size:9.5px;letter-spacing:1px}
    .lane-canvas{--label-w:86px}
    .lane-topbar{padding-left:98px}
    .lane-topbar-label{display:none}
    .lane-label,.lane-head-label{padding:0 8px}
    .lane-label span{font-size:10px}
    .lane-label small{display:none}
    .lane-month-seg{font-size:8px}
    .lane-bar{font-size:9px;padding:0 4px}
    .d-times{grid-template-columns:1fr}
    .modal{padding:12px}
    .modal-card{padding:20px}
  }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0b1020" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.2" y="5" width="17.6" height="16" rx="3"></rect>
          <path d="M3.2 9.6h17.6"></path>
          <path d="M8 3.2v3.4M16 3.2v3.4"></path>
          <path d="M7.6 13.4h2.2M11 13.4h2.2M14.4 13.4h2.2M7.6 17h2.2M11 17h2.2"></path>
        </svg>
      </div>
      <div>
        <h1><span>游戏活动日历</span></h1>
        <div class="brand-sub">原神 · 星铁 · 绝区零 · 终末地 · 明日方舟 · 鸣潮</div>
      </div>
    </div>
    <div class="top-meta">
      <div class="live"><span class="pulse"></span><span id="nowText">—</span></div>
      <div>数据更新 <b id="dataUpdated">—</b> · 北京时间 UTC+8</div>
    </div>
  </header>

  <section class="toolbar">
    <div class="month-nav">
      <button class="nav-btn" id="prevMonth" title="上个月" aria-label="上个月">‹</button>
      <div class="month-label">
        <strong id="monthTitle">2026年11月</strong>
        <span id="monthEn">NOVEMBER</span>
      </div>
      <button class="nav-btn" id="nextMonth" title="下个月" aria-label="下个月">›</button>
      <button class="btn-ghost" id="todayBtn">回到今天</button>
    </div>

    <div class="filters">
      <div class="filter-group" id="gameFilter"></div>
      <div class="filter-sep"></div>
      <div class="filter-group" id="typeFilter"></div>
    </div>

    <div class="toolbar-right">
      <button class="btn-ghost" id="adminBtn">数据维护<i class="local-dot hidden" id="localDot"></i></button>
      <div class="seg" id="viewToggle">
        <button data-view="month" class="on">月历</button>
        <button data-view="lane">泳道</button>
      </div>
    </div>
  </section>

  <main>
    <section class="board">
      <div class="month-strip" id="monthStrip"></div>
      <div class="board-hint">
        <span id="boardHint">月历标记每个行程的<b>开始</b>与<b>结束</b>日，点击日期可查看当天全部行程</span>
        <span class="keys">
          <span class="hint-key"><i class="legend-ico" data-marker="start"></i>开始</span>
          <span class="hint-key"><i class="legend-ico" data-marker="end"></i>结束</span>
          <span class="hint-key"><i class="legend-ico" data-marker="single"></i>仅一天</span>
        </span>
      </div>
      <div class="view-stage" id="viewStage">
      <div id="monthView">
        <div class="weekdays">
          <div>周一</div><div>周二</div><div>周三</div><div>周四</div><div>周五</div><div class="we">周六</div><div class="we">周日</div>
        </div>
        <div class="weeks" id="weeks"></div>
      </div>
      <div id="laneView" class="hidden"></div>
      </div>
    </section>

    <aside class="side">
      <div class="side-head">
        <div class="side-title">
          <b id="sideTitle">进行中</b>
          <span id="sideCount"></span>
        </div>
        <div class="side-tabs" id="sideTabs">
          <button class="side-tab on" data-tab="ongoing">进行中<em id="tabOngoing"></em></button>
          <button class="side-tab" data-tab="upcoming">即将开始<em id="tabUpcoming"></em></button>
          <button class="side-tab" data-tab="codes">兑换码</button>
        </div>
      </div>
      <div class="side-body" id="sideBody"></div>
      <div class="side-foot">
        时间为北京时间；数据整理自官方公告与社区汇总，部分持续活动结束时间未公布。版本末段时间以官方为准。
      </div>
    </aside>
  </main>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="modal-card" id="modalCard"></div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="关闭">×</button>
  <img id="lbImg" alt="官方活动图">
  <a class="lb-open" id="lbOpen" target="_blank" rel="noopener">在新标签页查看原图 ↗</a>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
